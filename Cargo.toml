[package]
name = "pam_aws_sts"
version = "0.1.0"
edition = "2021"
# Verified against this toolchain in CI. The README promises 1.94+, and
# nothing enforced it before, so an accidental bump could ship unnoticed.
rust-version = "1.94"
description = "PAM module for PostgreSQL authentication via AWS STS temporary credentials"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
# Validate STS TLS against the operating system trust store instead of the
# Mozilla root set compiled into the module by `webpki-roots`.
#
# The bundled roots mean the host's CA policy is ignored: root updates and
# revocations need a rebuild, and an environment that terminates egress TLS on
# an inspecting proxy with a private CA cannot work at all. Build with
# `--features native-certs` in those environments.
native-certs = ["ureq/native-certs"]

[dependencies]
# AWS SigV4 signing
aws-sigv4 = "1.5.1"
aws-credential-types = { version = "1.3.0", features = ["hardcoded-credentials"] }
aws-smithy-runtime-api = { version = "1.14.0", features = ["client"] }

# HTTP client (blocking — no async runtime in PAM context)
ureq = { version = "2.12.1", features = ["tls"] }

# HTTP types (used for SigV4 request construction)
http = "1.5.0"

# Parsing
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8.23"

# XML parsing for STS response.
# 0.41 is the first release carrying fixes for RUSTSEC-2026-0194 and
# RUSTSEC-2026-0195 (quadratic attribute scanning and unbounded
# namespace-declaration allocation).
quick-xml = "0.41"

# Security
zeroize = { version = "1.9.0", features = ["derive"] }

# Logging
log = "0.4.33"
syslog = "7.0.0"

# Time
chrono = { version = "0.4.45", features = ["serde"] }

# PAM (raw FFI - we define our own thin bindings for maximum control)
libc = "0.2.189"

[dev-dependencies]
tempfile = "3.27.0"
