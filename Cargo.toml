[package]
name = "pam_aws_sts"
version = "0.1.0"
edition = "2021"
description = "PAM module for PostgreSQL authentication via AWS STS temporary credentials"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# AWS SigV4 signing
aws-sigv4 = "1.5.1"
aws-credential-types = { version = "1.3.0", features = ["hardcoded-credentials"] }
aws-smithy-runtime-api = { version = "1.14.0", features = ["client"] }

# HTTP client (blocking — no async runtime in PAM context)
ureq = { version = "2.12.1", features = ["tls"] }

# HTTP types (used for SigV4 request construction)
http = "1.5.0"

# Parsing
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8.23"

# XML parsing for STS response
quick-xml = "0.36.2"

# Security
zeroize = { version = "1.9.0", features = ["derive"] }

# Logging
log = "0.4.33"
syslog = "7.0.0"

# Time
chrono = { version = "0.4.45", features = ["serde"] }

# PAM (raw FFI - we define our own thin bindings for maximum control)
libc = "0.2.189"

[dev-dependencies]
tempfile = "3.27.0"
