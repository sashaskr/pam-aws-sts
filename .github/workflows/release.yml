name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-debian-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - run: strip target/release/libpam_aws_sts.so
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/libpam_aws_sts.so dist/pam_aws_sts.so
          cp config/pam_aws_sts.toml.sample dist/
          cp config/pam.d/awssts dist/
          cp config/pg_hba.conf dist/
          tar czf pam_aws_sts-linux-amd64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: pam_aws_sts-linux-amd64
          path: pam_aws_sts-linux-amd64.tar.gz

  build-debian-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - run: strip target/release/libpam_aws_sts.so
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/libpam_aws_sts.so dist/pam_aws_sts.so
          cp config/pam_aws_sts.toml.sample dist/
          cp config/pam.d/awssts dist/
          cp config/pg_hba.conf dist/
          tar czf pam_aws_sts-linux-arm64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: pam_aws_sts-linux-arm64
          path: pam_aws_sts-linux-arm64.tar.gz

  build-al2023:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in Amazon Linux 2023
        run: |
          docker run --rm -v $PWD:/src -w /src amazonlinux:2023 bash -c '
            dnf install -y gcc tar gzip pam-devel make perl-interpreter &&
            curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
            source $HOME/.cargo/env &&
            cargo build --release &&
            strip target/release/libpam_aws_sts.so
          '
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/libpam_aws_sts.so dist/pam_aws_sts.so
          cp config/pam_aws_sts.toml.sample dist/
          cp config/pam.d/awssts dist/
          cp config/pg_hba.conf dist/
          tar czf pam_aws_sts-al2023-amd64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: pam_aws_sts-al2023-amd64
          path: pam_aws_sts-al2023-amd64.tar.gz

  build-el9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in Rocky Linux 9
        run: |
          docker run --rm -v $PWD:/src -w /src rockylinux:9 bash -c '
            dnf install -y gcc tar gzip pam-devel make perl-interpreter &&
            curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
            source $HOME/.cargo/env &&
            cargo build --release &&
            strip target/release/libpam_aws_sts.so
          '
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/libpam_aws_sts.so dist/pam_aws_sts.so
          cp config/pam_aws_sts.toml.sample dist/
          cp config/pam.d/awssts dist/
          cp config/pg_hba.conf dist/
          tar czf pam_aws_sts-el9-amd64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: pam_aws_sts-el9-amd64
          path: pam_aws_sts-el9-amd64.tar.gz

  publish:
    needs: [build-debian-amd64, build-debian-arm64, build-al2023, build-el9]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
