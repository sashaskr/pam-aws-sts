# PostgreSQL host-based authentication configuration
# This file controls which users can connect and how they authenticate.
#
# TYPE  DATABASE  USER       ADDRESS       METHOD
# Allow the postgres superuser to connect locally without PAM (for bootstrap)
local   all       postgres                 trust

# All other connections authenticate via PAM using the awssts service
host    all       all        0.0.0.0/0     pam     pamservice=awssts
local   all       all                      pam     pamservice=awssts
