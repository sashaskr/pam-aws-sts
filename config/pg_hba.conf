# PostgreSQL host-based authentication configuration for pam_aws_sts
# Install to the path reported by: SHOW hba_file;
#
# ---------------------------------------------------------------------------
# WHY EVERY TCP RULE BELOW IS "hostssl" AND NOT "host"
#
# PostgreSQL's PAM authentication behaves like the "password" method: the
# client's password is transmitted to the server in CLEARTEXT.
#   https://www.postgresql.org/docs/16/auth-pam.html
#   https://www.postgresql.org/docs/16/auth-password.html
#
# With pam_aws_sts the "password" is a live set of AWS STS credentials
# (AccessKeyId + SecretAccessKey + SessionToken). Allowing a plaintext TCP
# connection therefore leaks usable AWS credentials to anyone on the path.
#
# "hostssl" matches ONLY TLS connections, so a client that offers
# sslmode=disable never reaches the PAM stack. Do not relax this to "host".
# ---------------------------------------------------------------------------
#
# Requires in postgresql.conf:
#   ssl = on
#   ssl_cert_file = 'server.crt'
#   ssl_key_file  = 'server.key'
#
# Clients should connect with sslmode=verify-full and a pinned root so that
# the credentials are not handed to an impostor server:
#   PGSSLMODE=verify-full PGSSLROOTCERT=/path/to/ca.crt psql -h db.example.com ...

# TYPE      DATABASE  USER      ADDRESS          METHOD

# Local socket bootstrap for the superuser. Not reachable over the network.
local       all       postgres                   trust

# IAM-authenticated access over TLS only.
# Replace 10.0.0.0/8 with the narrowest CIDR that covers your clients.
# Do NOT use 0.0.0.0/0: it exposes the auth endpoint, and every attempt costs
# the server a blocking STS round trip.
hostssl     all       all       10.0.0.0/8       pam     pamservice=awssts

# Fail loudly on plaintext TCP instead of falling through to another method.
# Without this the connection is still refused, but the log message is vaguer.
# Both forms of the refusal end in "no encryption"; that string is what proves
# a plaintext client was stopped here rather than by the PAM module.
host        all       all       0.0.0.0/0        reject
host        all       all       ::/0             reject

# Local socket access via PAM (optional; remove if you do not need it).
local       all       all                        pam     pamservice=awssts
